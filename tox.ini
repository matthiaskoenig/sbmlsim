[tox]
envlist = ty, py3.{13,14}

[testenv]
package = wheel
wheel_build_env = .pkg
# the semantic cases of the SBML Test Suite are cached in the home directory,
# and `SBMLSIM_TEST_SUITE_PATH` points at them when they live elsewhere
passenv =
    HOME
    USERPROFILE
    XDG_CACHE_HOME
    SBMLSIM_TEST_SUITE_PATH
deps =
    pytest
    pytest-xdist
commands =
    pytest

[testenv:testsuite]
# the semantic cases of the SBML Test Suite, which a normal run deselects. The
# cases are fetched first, without them the tests would only skip
commands =
    python {toxinidir}/scripts/testsuite.py download
    pytest -m testsuite

[testenv:ty]
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
commands =
    ty check
