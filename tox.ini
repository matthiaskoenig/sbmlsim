[tox]
# the tests on every supported python; ty runs in the environment of the
# project, `uv run ty check`
envlist = py3.{14,15}

[testenv]
package = wheel
# the interpreters of uv (python-build-standalone), as in the environment of the
# project and in the continuous integration, never a python of the system: the
# extension of libroadrunner 2.11 for python 3.15 takes the symbols of the GDB
# JIT interface (`__jit_debug_register_code`, `__jit_debug_descriptor`) from
# the interpreter, which the python 3.15 of uv exports and e.g. the one of
# Ubuntu does not, so `import roadrunner` fails there with `undefined symbol:
# __jit_debug_register_code`; the extension for python 3.14 defines them itself
uv_python_preference = only-managed
wheel_build_env = .pkg
# the networks of `sbmlsim.sciml` need `petab-sciml`, the engine COPASI
# `python-copasi`
extras =
    sciml
    copasi
# the builds of the branch `develop` of libroadrunner, which the package
# depends on (`libroadrunner>=2.11.1.dev655`, not on PyPI): the environments
# resolve from `pyproject.toml` and not from `uv.lock`, and `uv pip install`,
# with which tox-uv installs the dependencies of the package, reads neither
# `tool.uv.sources` nor `tool.uv.index` of the project, so the index is given
# as an environment variable, inherited by every environment (none of
# `testsuite`, `sciml`, `petab` and `benchmark` sets `set_env` of its own).
# PyPI stays the default index and is where every other package comes from,
# while `UV_INDEX` is searched first and the index strategy of uv is
# `first-index`, so libroadrunner comes from the builds alone and never from
# PyPI. Without the index the install of the dependencies fails with
# `No solution found ... libroadrunner`
set_env =
    UV_INDEX = https://matthiaskoenig.github.io/roadrunner-wheels/simple/
# the semantic cases of the SBML Test Suite are cached in the home directory,
# and `SBMLSIM_TEST_SUITE_PATH` points at them when they live elsewhere. The
# same holds for the PEtab SciML test suite and `SBMLSIM_SCIML_SUITE_PATH`, and
# for the PEtab test suite and `SBMLSIM_PETAB_SUITE_PATH` and the PEtab
# benchmark collection and `SBMLSIM_BENCHMARK_PATH`
passenv =
    HOME
    USERPROFILE
    XDG_CACHE_HOME
    SBMLSIM_TEST_SUITE_PATH
    SBMLSIM_SCIML_SUITE_PATH
    SBMLSIM_PETAB_SUITE_PATH
    SBMLSIM_BENCHMARK_PATH
# plotly and pypdf are in the `dev` extra, the tests of the interactive
# figures and of the PDF reports need them
deps =
    pytest
    pytest-xdist
    plotly
    pypdf
# the reference of the forward pass, the CPU build: the default build for
# linux brings 2 GB of CUDA libraries
allowlist_externals = uv
commands_pre =
    uv pip install --python {env_python} --index-url https://download.pytorch.org/whl/cpu torch
commands =
    pytest

[testenv:testsuite]
# the semantic cases of the SBML Test Suite, which a normal run deselects. The
# cases are fetched first, without them the tests would only skip. They do not
# use torch, so it is not installed
commands_pre =
commands =
    python {toxinidir}/scripts/testsuite.py download
    pytest -m testsuite

[testenv:sciml]
# the cases of the PEtab SciML test suite, which a normal run deselects. The
# cases are fetched first, without them the tests would only skip
commands =
    python {toxinidir}/scripts/sciml_testsuite.py download
    pytest -m sciml_testsuite tests/sciml

[testenv:petab]
# the cases of the PEtab v2 test suite, which a normal run deselects. The cases
# are fetched first, without them the tests would only skip
commands =
    python {toxinidir}/scripts/petab_testsuite.py download
    pytest -m petab_testsuite tests/fit

[testenv:benchmark]
# the problems of the PEtab benchmark collection, which a normal run deselects,
# some take minutes. The collection is fetched and converted first
commands =
    python {toxinidir}/scripts/petab_benchmark.py download
    pytest -m petab_benchmark tests/fit
