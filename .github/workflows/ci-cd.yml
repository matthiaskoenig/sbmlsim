name: CI-CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the release job raises what it needs
permissions:
  contents: read

concurrency:
  # a newer run supersedes the running one of the same pull request. A push is
  # a group of its own, so it is never superseded: a release waits for the run
  # of its commit on develop (see the job `tested`), and two merges in a row
  # would otherwise leave the first commit untested. A release is never
  # superseded either, every tag is a group of its own
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  test:
    # a tag is not tested again, see the job `tested`
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # continuous integration tests the newest python on every platform, the
        # older versions are tested locally with `tox run-parallel`, see
        # docs/development.md
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up the environment
      # the dependencies are the versions of uv.lock, the package is installed
      # as a wheel and not editable, so the tests run against what is
      # published. The key of the cache has the os and the python version but
      # not the job, so every entry of the matrix has a key of its own and
      # saves it; the other jobs on linux with python 3.14 (ty, docs, the
      # suites) share the key of the entry (ubuntu-latest, 3.14) and only
      # restore it
      uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}
        sync: --extra dev --no-editable
        save-cache: "true"
    - name: Test
      # the slowest tests are listed at the end of the log
      run: uv run --no-sync pytest --durations=20

  install:
    # the package as `pip install sbmlsim` installs it, without extras: the
    # environment of the test matrix has the extras of `dev`, which would hide
    # a dependency the package needs and does not declare. It is the one job
    # which does not use uv.lock: it resolves from pyproject.toml as the
    # install of a user does, i.e. the newest releases within the bounds, so a
    # release of a dependency which breaks sbmlsim shows up here before
    # dependabot moves the lock to it
    name: plain install
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up uv and python
      uses: ./.github/actions/setup
      with:
        python-version: "3.14"
    - name: Install the package without extras
      run: |
        uv venv "$RUNNER_TEMP/plain"
        uv pip install --python "$RUNNER_TEMP/plain/bin/python" .
    - name: Run a scan and write its result as netCDF
      # isolated (-I) and outside of the repository, so the package is the
      # installed one and not the sources
      working-directory: ${{ runner.temp }}
      run: '"$RUNNER_TEMP/plain/bin/python" -I "$GITHUB_WORKSPACE/scripts/plain_install.py"'

  tests:
    # the one check the branch protection requires; the names of the matrix
    # jobs change with the matrix, this name does not, see .github/rulesets/
    name: tests
    needs: [test, install]
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the results of the test matrix and of the plain install
      env:
        RESULT: ${{ needs.test.result }}
        INSTALL: ${{ needs.install.result }}
      run: |
        echo "test matrix: $RESULT, plain install: $INSTALL"
        test "$RESULT" = "success" && test "$INSTALL" = "success"

  tested:
    # a release does not run the test matrix again. The tag is on a commit of
    # develop, and the push of that commit ran the matrix on exactly this
    # tree; the job waits for that run and fails unless it succeeded, so the
    # tag can be pushed right after the merge of the release
    name: tested on develop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read  # the runs of this workflow
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check that the tag is on develop
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
          echo "::error::$GITHUB_REF_NAME is not on develop, a release is tagged on develop"
          exit 1
        fi
    - name: Wait for the run of the commit on develop
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        api="repos/$GITHUB_REPOSITORY/actions"
        # the run starts with the merge, a tag pushed right after it may be first
        run_id=""
        for attempt in $(seq 1 20); do
          run_id=$(gh api "$api/workflows/ci-cd.yml/runs?branch=develop&event=push&head_sha=$GITHUB_SHA" \
            --jq '.workflow_runs[0].id // empty' || true)
          [ -n "$run_id" ] && break
          sleep 15
        done
        if [ -z "$run_id" ]; then
          echo "::error::no CI-CD run of the push of $GITHUB_SHA to develop"
          exit 1
        fi
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
        echo "waiting for $url"
        # a failed request answers nothing, which is not `completed` either
        until [ "$(gh api "$api/runs/$run_id" --jq .status || true)" = "completed" ]; do
          sleep 30
        done
        conclusion=$(gh api "$api/runs/$run_id" --jq .conclusion)
        echo "$url: $conclusion"
        if [ "$conclusion" != "success" ]; then
          echo "::error::the tests of $GITHUB_SHA on develop did not pass ($url); once they do, re-run the failed jobs of this release"
          exit 1
        fi

  testsuite:
    # the semantic cases of the SBML Test Suite against the pinned release and
    # the cases of the PEtab SciML test suite against the pinned commit, which
    # the baselines record, as two jobs which run next to each other. A normal
    # run of the tests deselects them: they answer what libroadrunner and the
    # networks support, which a change to sbmlsim rarely moves, and they take
    # longer than the rest together. A release does not go out without them
    name: sbml test suite
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up the environment
      uses: ./.github/actions/setup
      with:
        python-version: "3.14"
        sync: --extra dev --no-editable
    - name: Download the pinned release
      run: uv run --no-sync python scripts/testsuite.py download
    - name: Run the semantic cases against the pinned release
      run: uv run --no-sync pytest -m testsuite

  sciml:
    # see the job `testsuite`; a job of its own and not a matrix, the check of
    # a matrix job which is skipped is named by the unevaluated expression
    name: petab sciml test suite
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up the environment
      uses: ./.github/actions/setup
      with:
        python-version: "3.14"
        sync: --extra dev --no-editable
    - name: Download the pinned commit
      run: uv run --no-sync python scripts/sciml_testsuite.py download
    - name: Run the cases of the PEtab SciML test suite against the pinned commit
      run: uv run --no-sync pytest -m sciml_testsuite tests/sciml

  petab:
    # see the job `testsuite`
    name: petab test suite
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up the environment
      uses: ./.github/actions/setup
      with:
        python-version: "3.14"
        sync: --extra dev --no-editable
    - name: Download the pinned commit
      run: uv run --no-sync python scripts/petab_testsuite.py download
    - name: Run the cases of the PEtab test suite against the pinned commit
      run: uv run --no-sync pytest -m petab_testsuite tests/fit

  submission:
    # the results a submission to the SBML Test Suite Database is made of. A
    # release submits against the newest suite, not against the pinned one.
    # The archive is an attachment of the release and never blocks it
    name: sbml test suite submission
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up the environment
      uses: ./.github/actions/setup
      with:
        python-version: "3.14"
        sync: --no-editable
    - name: Run the SBML Test Suite against its newest release
      # the cases run in one process per core
      run: uv run --no-sync python scripts/testsuite.py submission --version latest --output submission
    - name: Upload the submission
      uses: actions/upload-artifact@v7
      with:
        name: submission
        path: submission/*.zip
        if-no-files-found: error

  release:
    needs: [tested, testsuite, sciml, petab, submission]
    # the submission is an attachment, the release goes out without it
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
      && needs.tested.result == 'success'
      && needs.testsuite.result == 'success'
      && needs.sciml.result == 'success'
      && needs.petab.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/sbmlsim
    permissions:
      id-token: write  # trusted publishing to PyPI
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up uv
      uses: ./.github/actions/setup
      with:
        python-version: "3.14"
        cache: "false"
    - name: Build package
      run: uvx hatch build
    - name: Check the package
      run: uvx twine check dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
    - name: Download the submission
      # missing when the submission failed, which is no reason to stop here:
      # the package is on PyPI by this point
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: submission
        path: submission
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        body_path: "release-notes/${{ github.ref_name }}.md"
        files: submission/*.zip
        # the submission may be missing, the notes are the release
        fail_on_unmatched_files: false
        draft: false
        prerelease: false

  sync-main:
    # main tracks the latest published release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - uses: actions/checkout@v7
      with:
        # a shallow clone cannot be pushed to another branch
        fetch-depth: 0
    - name: Fast-forward main to the release
      # no --force: the push fails loudly if it would not be a fast-forward
      run: git push origin HEAD:main
