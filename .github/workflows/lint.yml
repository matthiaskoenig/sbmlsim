name: lint

on:
  push:
    # feature branches are checked through their pull request
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a superseded run of a pull request is cancelled, a push is checked on its own
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    # the names of the jobs are the checks the branch protection requires,
    # see .github/rulesets/develop.json
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # the ruff version is read from the dev dependencies in pyproject.toml
      - name: Lint
        # astral-sh/ruff-action publishes no floating major tag beyond v3
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format=github
      - name: Format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check --diff

  ty:
    name: ty
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the environment
        # ty resolves the imports of `src`, `tests`, `examples` and `scripts`
        # in the environment, the dev extra has all of them; there is no ty
        # action, and an environment is what it would need as well
        uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          sync: --extra dev
      - name: Type check
        run: uv run --no-sync ty check --output-format github
