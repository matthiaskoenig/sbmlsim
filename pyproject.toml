[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbmlsim"
dynamic = ["version"]
description = "sbmlsim are python utilities for the simulation of SBML models."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT AND CC-BY-SA-3.0"
license-files = ["LICENSE"]
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"},
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"SBML",
	"simulation",
	"parameter fitting",
	"sensitivity analysis",
	"computational modeling",
]
dependencies = [
	# SBML, its formulas and COMBINE archives
	"sbmlutils>=0.16.0",
	"pymetadata>=0.8.1",
	# the differential equations of a model as markdown, written into the
	# COMBINE archive of a release (`sbmlsim.release.archive`)
	"sbmlode>=0.3.0",
	"python-libsbml>=5.21.2",
	# simulation
	# the develop builds of matthiaskoenig/roadrunner-wheels: the executor relies
	# on fixes of libroadrunner which are not released yet (roadrunner #1381,
	# #1382, #1383, #1384, #1420), a release of libroadrunner satisfies it as well
	"libroadrunner>=2.11.1.dev655",
	# the comparison of the installed libroadrunner with this requirement at
	# `import sbmlsim` (`sbmlsim.engine.check_roadrunner`), which imports
	# `packaging.version` (2 ms) and `packaging.requirements` only for a
	# requirement which is no floor; the floor is a low one, the two have been
	# stable for years and a tight one would conflict with other packages
	"packaging>=25.0",
	# data structures, units and numerics
	"numpy>=2.5.3",
	"pandas>=3.0.6",
	"xarray>=2026.9.0",
	# the netCDF files of a ScanResult: h5netcdf and h5py, its backend, which
	# h5netcdf only installs as its extra `h5py`; `sbmlsim.sciml` reads the
	# weights of the networks with h5py as well
	"h5netcdf>=1.6.0",
	"h5py>=3.16.0",
	# the zstd filter of HDF5, with which the results are compressed
	"hdf5plugin>=7.1.0",
	"scipy>=1.18.1",
	"sympy>=1.14.0",
	# the formulas of a model and of a network as sympy expressions;
	# `sbmlsim.sciml.formula` overrides `handle_apply` of its parser for `rem` and
	# `quotient`, the test of both is the tripwire when the bound is raised
	"sbmlmath>=0.4.1,<0.5",
	"pint>=0.26.1",
	"pydantic>=2.14.1",
	# parameter fitting and sensitivity analysis
	# 0.10.0 converts an observable on the scale `log10` of PEtab v1 to the
	# log-normal noise of the same density (`petab1to2`), which the test suite
	# and the benchmark collection compare the log-likelihood of
	"petab>=0.10.0",
	"SALib>=1.6.0",
	# the non-compartmental analysis of the PK observables of a scan, imported
	# when a PK observable is compiled
	"pkpdutils>=1.3.0",
	# the files of the PEtab test suite, the benchmark collection and the networks
	"pyyaml>=6.0.3",
	# plots and reports
	"matplotlib>=3.11.2",
	# not imported: the images of matplotlib; 13.0.0 fixes the advisories of
	# 12.3.0, among them the critical GHSA-5x8w-8jj5-q52h, GHSA-332p-7hrc-92wf,
	# GHSA-8g5g-8vmr-9782, GHSA-v9pv-5gc8-w2m6 and GHSA-w889-685w-c8fh
	"pillow>=13.0.0",
	"seaborn>=0.13.2",
	"jinja2>=3.1.6",
	"rich>=15.0.0",
	# the methods report of a fit: MathML of the HTML report, the PDF of the Typst report
	"latex2mathml>=3.77",
	"typst>=0.13",
	# the CA bundle of requests, with which sbmlutils and pymetadata reach the
	# network; 2026.10.19 removes the emSign root of the compromised
	# intermediate keys (GHSA-6q48-6c7w-9gw2)
	"certifi>=2026.10.19",
]

[project.optional-dependencies]
# neural networks of hybrid problems (PEtab SciML), see sbmlsim.sciml: the
# packages sbmlsim.sciml imports which are not dependencies of sbmlsim
sciml = [
	"petab-sciml>=0.0.3",
]
# COPASI as a second engine of the simulator, see sbmlsim.engine
copasi = [
	"python-copasi>=4.48.311",
]
# AMICI as a third engine, built from source on installation (a C++ compiler,
# a BLAS library and the headers of HDF5 from the system, CMake and SWIG from
# PyPI) and not part of `dev`; it needs ninja to compile a model
amici = [
	"amici>=1.2.0",
	"ninja",
]
# the task types of simrun, which runs the analyses of `python -m sbmlsim.run` on
# a cluster, see sbmlsim.simrun; simrun needs python 3.14
simrun = [
	"simrun>=0.3.0",
]
dev = [
	"sbmlsim[sciml,copasi,simrun]",
	# the reference of the forward pass in the tests, never imported by the package
	"torch>=2.14.1",
	"bump-my-version>=1.5.1",
	"ruff>=0.16.10",
	"pre-commit>=4.6.2",
	"ty>=0.0.85",
	# 4.67.5 rejects its own `.tox/.tmp/package` under umask 002 (tox-dev/tox#4357)
	"tox>=4.64.9,!=4.67.5",
	# tox creates its environments with uv, as the continuous integration does;
	# without the plugin it installs with pip, whose resolver fails on python 3.14
	"tox-uv>=1.36.1",
	"pytest>=9.1.1",
	# the probe models of the tests of the simulator are written in antimony
	"antimony>=3.1.3",
	"zensical>=0.0.68",
	"mkdocstrings-python>=2.0.9",
	"pytest-xdist>=3.8.0",
	# the text of the PDF reports in the tests
	"pypdf>=6.21.0",
	# the prototype of the plotly figures, see sbmlsim.plot.serialization_plotly
	"plotly>=7.1.0",
]

# the kinds of `python -m sbmlsim.run` as task types of simrun
[project.entry-points."simrun.task_types"]
"sbmlsim.simulate" = "sbmlsim.simrun:SIMULATE"
"sbmlsim.fit" = "sbmlsim.simrun:FIT"
"sbmlsim.identifiability" = "sbmlsim.simrun:IDENTIFIABILITY"
"sbmlsim.fisher" = "sbmlsim.simrun:FISHER"
"sbmlsim.report" = "sbmlsim.simrun:REPORT"
"sbmlsim.petab" = "sbmlsim.simrun:PETAB"
"sbmlsim.scan" = "sbmlsim.simrun:SCAN"
"sbmlsim.sensitivity" = "sbmlsim.simrun:SENSITIVITY"
"sbmlsim.uncertainty" = "sbmlsim.simrun:UNCERTAINTY"
"sbmlsim.adopt" = "sbmlsim.simrun:ADOPT"
"sbmlsim.factory" = "sbmlsim.simrun:FACTORY"
"sbmlsim.credibility" = "sbmlsim.simrun:CREDIBILITY"
"sbmlsim.release" = "sbmlsim.simrun:RELEASE"

[project.urls]
Homepage = "https://matthiaskoenig.github.io/sbmlsim"
Documentation = "https://matthiaskoenig.github.io/sbmlsim"
Repository = "https://github.com/matthiaskoenig/sbmlsim"
Issues = "https://github.com/matthiaskoenig/sbmlsim/issues"
Changelog = "https://github.com/matthiaskoenig/sbmlsim/tree/develop/release-notes"
Download = "https://pypi.org/project/sbmlsim"

[tool.hatch.version]
path = "./src/sbmlsim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sbmlsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests run in parallel (pytest-xdist), `pytest -n 0` runs them in one process.
# `worksteal` hands the tests which wait at a busy worker to an idle one, which
# takes a fifth less time than `load` with the long tests near the end.
# The semantic cases of the SBML Test Suite are not part of a normal run, they
# are the conformance of libroadrunner and not of a change: `pytest -m testsuite`
# runs them, and a release does
addopts = "-n auto --dist worksteal -m 'not testsuite and not sciml_testsuite and not petab_testsuite and not petab_benchmark and not benchmark'"
# a passed subtest is not listed, a failed one is
verbosity_subtests = 0
# a warning fails the test which raises it, so a deprecation is fixed when it
# appears and not when the feature is removed
filterwarnings = ["error"]
markers = [
    "testsuite: a semantic case of the SBML Test Suite, run before a release",
    "sciml_testsuite: a case of the PEtab SciML test suite, run before a release",
    "petab_testsuite: a case of the PEtab v2 test suite, run before a release",
    "petab_benchmark: a problem of the PEtab benchmark collection, run on demand",
    "benchmark: the speed of the scan core, run on demand with `-n 0 -s`",
    "slow: a long end-to-end run, deselected in continuous integration with `--skip-slow`",
]

[tool.ty.environment]
# the package lives in the src layout, the examples are a package at the root of
# the repository; the checked python version is inferred from
# `project.requires-python` (i.e. the oldest supported version)
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests", "examples", "scripts"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true

[tool.uv]
# the version is read from `__init__.py`: a bump of it refreshes the metadata
# of the editable install, which `importlib.metadata` reads (the provenance)
cache-keys = [{ file = "pyproject.toml" }, { file = "src/sbmlsim/__init__.py" }]

[tool.uv.sources]
# the CPU build of torch: the default build for linux brings 2 GB of CUDA
# libraries, which the comparison of a forward pass does not need. A single
# table and not a list of sources, which tox-uv cannot read
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
# the development environment, its lock, the continuous integration and tox
# run on the builds of the branch `develop` of libroadrunner, a package index
# of their wheels (matthiaskoenig/roadrunner-wheels, versions
# `<version>.dev<run>`); the sources are not part of the built package, which
# depends on the libroadrunner of PyPI (`uv pip install --no-sources .` and the
# job `plain install`). `uv lock --upgrade-package libroadrunner` moves the lock
# to the latest build
libroadrunner = { index = "roadrunner-dev" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "roadrunner-dev"
url = "https://matthiaskoenig.github.io/roadrunner-wheels/simple/"
explicit = true
